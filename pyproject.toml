[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trajrec"
version = "0.1.0"
description = "Resettable OpenClaw agent evaluation pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
trajrec = "orchestrator.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
